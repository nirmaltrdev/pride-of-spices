<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is REQUIRED for env(safe-area-inset-*) to work on iOS Safari -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <meta name="description" content="The Pride of Spices — Premium heritage spices and pure wild forest honey sourced directly from Wayanad, Kerala. Hand-harvested, traditionally processed, naturally pure. Black pepper, cardamom, cinnamon, cloves, nutmeg, turmeric, and wild honey." />
    <meta name="keywords" content="Wayanad spices, black pepper Kerala, wild forest honey, organic spices India, traditional spices, premium spices, cardamom, cinnamon Ceylon, turmeric, cloves, nutmeg, Nilgiri honey, export spices India" />
    <meta name="author" content="The Pride of Spices, Wayanad" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1A1A1A" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.theprideofspices.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.theprideofspices.com/" />
    <meta property="og:title" content="The Pride of Spices — Heritage Spices &amp; Wild Forest Honey from Wayanad" />
    <meta property="og:description" content="Rooted in Tradition. Crafted by Nature. Delivered with Pride. Premium heritage spices and pure forest honey from the biosphere of Wayanad, Kerala." />
    <meta property="og:image" content="https://www.theprideofspices.com/images/hero_bg.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="The Pride of Spices" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Pride of Spices — Heritage Spices &amp; Wild Forest Honey" />
    <meta name="twitter:description" content="Premium heritage spices and pure forest honey sourced directly from Wayanad, Kerala. Hand-harvested. Traditionally processed. Naturally pure." />
    <meta name="twitter:image" content="https://www.theprideofspices.com/images/hero_bg.png" />

    <!-- Title -->
    <title>The Pride of Spices — Heritage Spices &amp; Wild Forest Honey from Wayanad, Kerala</title>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.theprideofspices.com/#website",
          "name": "The Pride of Spices",
          "url": "https://www.theprideofspices.com/",
          "description": "Premium heritage spices and pure forest honey from Wayanad, Kerala."
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.theprideofspices.com/#business",
          "name": "The Pride of Spices",
          "description": "Hand-harvested heritage spices and wild forest honey from the forests of Wayanad, Kerala. Traditionally processed, naturally pure, export quality.",
          "url": "https://www.theprideofspices.com/",
          "logo": "https://www.theprideofspices.com/favicon.svg",
          "image": "https://www.theprideofspices.com/images/hero_bg.png",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Wayanad",
            "addressRegion": "Kerala",
            "addressCountry": "IN"
          },
          "areaServed": "Worldwide",
          "priceRange": "$$$$",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@theprideofspices.com",
            "contactType": "sales"
          }
        },
        {
          "@type": "Product",
          "name": "Premium Black Pepper",
          "description": "Hand-harvested black pepper from ancient vines at 800m elevation in Wayanad's biosphere reserve. Sun-dried 7 days on traditional bamboo mats.",
          "brand": { "@type": "Brand", "name": "The Pride of Spices" },
          "offers": { "@type": "Offer", "availability": "https://schema.org/InStock" }
        }
      ]
    }
    </script>

    <!-- Google Fonts: Playfair Display (serif) + Inter (sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet" />

    <!-- Preload critical images -->
    <link rel="preload" as="image" href="/images/forest-path.jpg" />
    <link rel="preload" as="image" href="/images/forest_mist_background.jpg" />
